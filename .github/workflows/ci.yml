name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Tests that need the full NYC dataset skip automatically; the rest use synthetic data.
      - name: Tests
        run: uv run python -m pytest -q

      - name: Lint
        run: uv run python -m ruff check .

      - name: Formatting
        run: uv run python -m ruff format --check .

      - name: Documentation links
        run: uv run python scripts/check_docs.py
